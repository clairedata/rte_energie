# ==============================================================================
# DÉCLARATION DES SOURCES DE DONNÉES BRUTES (sources.yml)
# ==============================================================================
# Ce fichier informe dbt des tables qui existent déjà dans PostgreSQL,
# alimentées par vos scripts Python d'ingestion (ingest_rte.py & ingest_weather.py).
# Grâce à cette déclaration, dbt sait d'où proviennent les données brutes
# et peut tracer le graphe de dépendances (Lineage Graph).
# ==============================================================================

version: 2

sources:
  - name: raw_energy              # Nom logique donné à notre source de données
    schema: public                # Schéma PostgreSQL où vos tables brutes résident
    description: "Données brutes issues des API RTE France et Open-Meteo"
    
    tables:
      - name: consumption_forecast
        description: "Prévisions brutes de production et consommation électrique (RTE)"
        columns:
          - name: id
            description: "Clé primaire technique"
          - name: start_date
            description: "Horodatage de début du pas de mesure (TIMESTAMPTZ)"
          - name: end_date
            description: "Horodatage de fin du pas de mesure (TIMESTAMPTZ)"
          - name: value_mw
            description: "Puissance en Mégawatts (MW)"
          - name: production_type
            description: "Type de série (ex: AGGREGATED_CPC pour la consommation globale)"
          - name: forecast_type
            description: "Horizon de prévision (CURRENT, D-1, D-2, D-3)"
            
      - name: weather
        description: "Relevés et prévisions météo horaires (Open-Meteo)"
        columns:
          - name: id
            description: "Clé primaire technique"
          - name: timestamp
            description: "Horodatage de l'observation météo (TIMESTAMPTZ)"
          - name: temperature_c
            description: "Température à 2 mètres en degrés Celsius (°C)"
          - name: wind_speed
            description: "Vitesse du vent à 10 mètres en km/h"
