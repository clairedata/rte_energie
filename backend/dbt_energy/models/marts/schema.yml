# ==============================================================================
# TESTS DE QUALITÉ POUR LA COUCHE MARTS (schema.yml)
# ==============================================================================

version: 2

models:
  - name: fct_national_consumption
    description: "Série temporelle unifiée de consommation nationale (15 min)"
    columns:
      - name: start_date
        tests:
          - not_null
          - unique
      - name: value_mw
        tests:
          - not_null

  - name: fct_energy_features
    description: "Feature Store unifiant consommation horaire, météo et variables calendaires"
    columns:
      - name: observation_hour
        description: "Horodatage au pas d'une heure"
        tests:
          - not_null
          - unique
      - name: consumption_mw
        tests:
          - not_null
      - name: hour_of_day
        tests:
          - not_null
      - name: is_weekend
        tests:
          - not_null
