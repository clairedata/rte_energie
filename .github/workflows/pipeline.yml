name: RTE Energy & Weather Pipeline

on:
  # 1. Déclenchement automatique via Cron (Tous les jours à 06h00 UTC)
  schedule:
    - cron: '0 6 * * *'

  # 2. Déclenchement manuel possible depuis l'interface GitHub
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    # Service PostgreSQL temporaire lancé dans la machine virtuelle GitHub
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: energy_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Étape 1 : Récupérer le code du dépôt
      - name: Checkout du code
        uses: actions/checkout@v4

      # Étape 2 : Installer uv (gestionnaire de paquets ultra-rapide)
      - name: Installer uv
        uses: astral-sh/setup-uv@v5

      # Étape 3 : Installer Python
      - name: Configurer Python
        run: uv python install

      # Étape 4 : Installer les dépendances du projet
      - name: Installer les dépendances
        run: |
          cd backend
          uv sync

      # Étape 5 : Initialiser la base de données PostgreSQL
      - name: Initialiser les tables SQL
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: energy_db
          DB_USER: postgres
          DB_PASSWORD: password
        run: |
          cd backend
          uv run python src/rte_energy/init_db.py

      # Étape 6 : Exécuter le pipeline (RTE + Météo)
      - name: Lancer le Pipeline Energy & Meteo
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: energy_db
          DB_USER: postgres
          DB_PASSWORD: password
        run: |
          cd backend
          uv run python src/rte_energy/pipeline.py
